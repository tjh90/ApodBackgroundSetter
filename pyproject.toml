[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ApodBackgroundSetter"
version = "1.0.0"
description = "Sets a desktop background to the Astronomy Picture of the Day"
readme = "README.md"
license = {text = "AGPLv3"}
requires-python = ">=3.14"
dependencies = [
    "requests>=2.34.2",
]

[project.urls]
Repository = "https://github.com/tjh90/ApodBackgroundSetter"

[tool.hatch.build.targets.wheel]
packages = ["src"]
